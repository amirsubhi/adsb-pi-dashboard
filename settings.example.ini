# ADS-B Ground Station settings.
#
# install.sh copies this file to ~/adsb-dashboard/settings.ini on first install.
# Edit that copy, then apply the change with:
#   sudo systemctl restart adsb-dashboard
#
# Every line is optional: a blank or commented-out option uses the default shown.
# An environment variable (named in brackets) overrides the value set here.
# The settings page (http://<this Pi>:8099/settings) shows what is in effect.

[dashboard]

# Port the dashboard listens on. [ADSB_DASHBOARD_PORT]
# port = 8099

# Network address to listen on. 0.0.0.0 means every interface on your LAN;
# 127.0.0.1 means this Pi only. [ADSB_BIND]
# This dashboard has no login: keep it on your LAN and never port-forward it.
# bind = 0.0.0.0

# Folder where readsb or dump1090 writes aircraft.json and stats.json. [ADSB_READSB_DIR]
# readsb_dir = /run/readsb

# Folder where adsbexchange-feed writes status.json and receiver.json. [ADSB_ADSBX_DIR]
# adsbx_dir = /run/adsbexchange-feed

# Seconds between samples. [ADSB_POLL_INTERVAL]
# poll_interval = 15

# Seconds an aircraft can be out of range before its next sighting counts as
# a new history entry. [ADSB_SESSION_GAP]
# session_gap = 300

# Days of flight history and metrics to keep. [ADSB_RETAIN_DAYS]
# retain_days = 30

# Receiver position in decimal degrees. Only needed if readsb does not report
# it in receiver.json. Set both or neither. [ADSB_LAT] [ADSB_LON]
# receiver_lat =
# receiver_lon =

# Altitude in feet above which altitudes are shown as flight levels (FL).
# Malaysia 11000, UK 6000, USA and Canada 18000. [ADSB_TRANSITION_ALT]
# transition_alt = 18000

# Show the receiver's exact coordinates on the page. "no" rounds them to about
# 1 km so screenshots don't reveal your address. [ADSB_SHOW_EXACT_LOCATION]
# show_exact_location = no

# One other website allowed to read this dashboard's API, for example
# http://192.168.1.20:3000. Leave empty unless you are building something
# on top of the API. [ADSB_CORS_ORIGIN]
# cors_origin =
